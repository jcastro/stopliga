name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Upgrade pip
        run: python -m pip install --upgrade pip==26.3
      - name: Install package and quality tooling
        run: python -m pip install ".[dev]"
      - name: Ruff
        run: python -m ruff check src tests
      - name: Ruff format
        run: python -m ruff format --check src tests
      - name: Mypy
        run: python -m mypy src
      - name: Pip Audit
        run: python -m pip_audit --ignore-vuln CVE-2026-3219

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test tooling
        run: python -m pip install ".[dev]"
      - name: Compile
        run: python -m compileall run_stopliga.py src tests
      - name: Unit and integration tests with coverage
        run: python -m pytest

  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Install smoke test dependencies
        run: python -m pip install .
      - name: Build Alpine image
        run: docker buildx build --platform linux/${{ matrix.platform }} --load -t stopliga:test .
      - name: Validate the actual Compose runtime
        run: python scripts/container_smoke.py stopliga:test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpine-runtime-${{ matrix.platform }}
          path: container-smoke.json
